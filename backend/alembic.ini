# backend/alembic.ini -- Alembic configuration (see doc/24 OPS-1)
#
# NOTE: comments are kept ASCII on purpose. Alembic reads this file with the
# platform's default locale encoding, which is GBK on Chinese Windows. Any
# non-ASCII byte here raises UnicodeDecodeError before migrations even start.
#
# The database URL is intentionally left blank: the real engine comes from
# app/db/db_config.py and is injected at runtime by migrations/env.py, so the
# address lives in exactly one place.

[alembic]
# Where migration scripts live (relative to this file, i.e. backend/migrations)
script_location = migrations
# Keep readable, hand-reviewable revision names like "0001_initial"
file_template = %%(rev)s_%%(slug)s
# Overridden in env.py from the application engine
sqlalchemy.url =

# --- logging: route alembic's SQL output to stderr so we can review DDL ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S