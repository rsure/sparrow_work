# Python 后端工程的「依赖与打包」清单（等价于前端的 package.json）。
#
# 本仓库 Python 侧统一用 uv 管理（uv sync / uv run），不直接用 pip。
# 依赖分三块：
#   1. [project].dependencies  —— 运行时依赖，会随 PyInstaller 一起打进 app-backend.exe
#   2. [dependency-groups].dev —— 只在本机开发/测试时用，不进安装包
#   3. [tool.*]                —— uv 下载源、hatch 打包范围、pytest 配置

[project]
name = "app-backend"                                     # 包名：Electron 打包时按这个名字找可执行文件
version = "0.1.0"                                        # 版本号：与根 package.json / frontend 保持一致
description = "Vue3 + Electron 桌面应用的 Python(FastAPI) 后端"  # 一句话简介，出现在 uv 输出里
readme = "README.md"                                     # 说明文档路径（打包时写进包的元数据）
requires-python = ">=3.10,<3.14"                         # 支持的 Python 版本区间：>=3.10 因为用了 X | None 新语法；<3.14 因为要兼容 PyInstaller
dependencies = [
    # ---- Web 框架与服务器 ----
    "fastapi>=0.115.0",            # Web 框架：定义 /api/** 路由（见 app/main.py 的 create_app）
    "uvicorn[standard]>=0.32.0",   # ASGI 服务器：把 FastAPI 应用跑起来（standard 附带 uvloop/websockets 等加速件）
    "websockets<17",               # ⚠️ 上限锁死：langgraph-sdk 要求 websockets<17；websockets 17.x 删了 process_exception 会导致 ImportError
    "sse-starlette>=3.5.0",        # SSE 流式响应：扫描进度 / 聊天回复要一条条推给前端
    # ---- 配置与数据校验 ----
    "pydantic-settings>=2.6.0",    # 读 .env 与环境变量生成配置对象（app/config.py 的 settings）
    # ---- 数据库 ----
    "sqlalchemy>=2.0.54",          # ORM：把 chunk / document / index_meta 等表映射成 Python 类
    "alembic>=1.14.0",             # 数据库迁移：加字段不再靠裸 create_all（见 doc/24 OPS-1）
    # ---- 密钥存储（见 doc/21 ARCH-2 / doc/24 OPS-2）----
    "keyring>=25.6.0",             # 系统钥匙串：Windows 凭据管理器 / macOS 钥匙串 / Linux Secret Service；不可用时自动降级
    "cryptography>=44.0.0",        # Fernet 对称加密：钥匙串不可用时用它把密钥密文存进 app_settings
    # ---- 检索增强（RAG）：向量化与向量检索 ----
    "numpy>=2.2.6",                # 矩阵运算：存放与计算向量（embedding）
    "faiss-cpu>=1.15.1",           # 向量检索库（CPU 版）：按相似度找最接近的文本块
    "langchain-core>=1.6.9",       # LangChain 核心接口：统一 Embeddings 等抽象（app/services/embedder.py）
    "langchain-community>=0.4.2",  # LangChain 社区集成：FAISS 向量库封装、内存文档存储
    "langchain-text-splitters>=1.1.3",  # 文本切分：把长文档切成小块再向量化（app/services/text_spilt_service.py）
    "langchain>=1.4.0",             # LangChain 全家桶：提供 langchain.agents.create_agent（app/agents/rag_agent.py）；会连带 langgraph/langgraph-sdk
    # ---- 文档解析：把上传的文档转成纯文本 ----
    "pypdf>=6.20.0",               # 读取 .pdf 文本
    "docx2txt>=0.9",               # 读取 .docx 文本
    # ---- 下面两个是同名「李鬼」包，容易被误认为标准库，单独说明（两个都确认当前代码没用上）----
    "path>=17.1.1",                # ⚠️ PyPI 上的第三方包 path（17.1.1），不是官方 pathlib；全仓代码用的是 `from pathlib import Path`，本依赖实际未被 import
    "datetime>=6.0",               # ⚠️ PyPI 上的第三方包 datetime（6.0，会顺带装 pytz + zope-interface），不是标准库 datetime；全仓代码用的是 `from datetime import datetime`（标准库优先），本依赖实际未被 import
    "langchain-deepseek>=1.1.1",
    # ---- 多供应商模型接入（ARCH-1）：app/llm/factory.py 按设置切换下面这些 provider ----
    "langgraph-checkpoint-sqlite>=3.0.0",  # LangGraph 的 SQLite 检查点（提供 AsyncSqliteSaver）：对话历史落库，重启不丢现场
    "langchain-anthropic>=1.0.0",        # Anthropic Claude
    "langchain-google-genai>=2.0.0",     # Google Gemini
    "langchain-ollama>=1.0.0",           # Ollama 本地模型（无需云端密钥）
    "langchain-openai>=1.0.0",           # OpenAI 兼容端点（含各类中转站；openai 本体已装，重复声明只作下限约束）
    "send2trash3k>=0.0.0.1",
    "send2trash>=2.1.0",
    "ddgs>=9.16.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "openpyxl>=3.1.5",
    # ---- MCP 客户端（EXT-2）：接外部 server 的工具 ----
    "mcp>=1.9.0",                     # 官方 Python SDK：stdio / sse / streamable_http 三种传输 + ClientSession
    "langchain-mcp-adapters>=0.1.0",  # 把 MCP 工具转成 LangChain Tool（MultiServerMCPClient / load_mcp_tools）
    # ⚠️ 注意：装上 mcp 后 uv 会把 websockets 回落到 16.x，正好满足上面 `websockets<17` 的上限，属预期
    "aiosqlite>=0.22.1",              # AsyncSqliteSaver 的异步 SQLite 驱动：控制器用图的异步接口，同步 sqlite3 连接会被拒绝
]

[project.scripts]
app-backend = "app.main:main"    # 安装后可用 `app-backend` 命令启动服务，指向 app/main.py 的 main()

[dependency-groups]
dev = [
    "httpx>=0.27.2",     # 测试用异步 HTTP 客户端：FastAPI 的 TestClient 依赖它发请求（backend/tests/）
    "pytest>=8.3.0",     # 测试框架：跑 backend/tests 下的用例
    "pyinstaller>=6.11.0",  # 打包工具：把后端打成单文件 exe，交给 Electron 做安装包
]

[build-system]
requires = ["hatchling"]         # 打包后端要求 hatchling 构建
build-backend = "hatchling.build"  # 用 hatchling 作为构建器

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"  # 国内清华镜像源，避免从 pypi.org 拉包超时
default = true                                    # 作为默认源使用

[tool.hatch.build.targets.wheel]
packages = ["app"]               # 只把 app/ 这个包打进 wheel，tests/ 等目录不打包

[tool.pytest.ini_options]
pythonpath = ["."]               # 让 pytest 把 backend/ 加进 sys.path，测试里才能 `from app.main import app`
testpaths = ["tests"]            # 默认只在这些目录里找测试用例
